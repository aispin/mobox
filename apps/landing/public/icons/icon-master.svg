<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="#0b0b14" />
  <rect x="0" y="0" width="512" height="512" fill="url(#glow)" />

  <!-- isometric cube -->
  <g>
    <path d="M256 96 L416 176 L416 336 L256 416 L96 336 L96 176 Z" fill="url(#face)" />
    <path d="M256 96 L416 176 L256 256 L96 176 Z" fill="#7c5cff" opacity="0.18" />
    <path d="M256 256 L416 176 L416 336 L256 416 Z" fill="#22d3ee" opacity="0.1" />
    <g fill="none" stroke="url(#stroke)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <path d="M256 96 L416 176 L416 336 L256 416 L96 336 L96 176 Z" />
      <path d="M256 96 L256 256 L96 176" />
      <path d="M256 256 L416 176" />
      <path d="M256 256 L256 416" />
    </g>
  </g>

  <!-- floating accents -->
  <rect x="392" y="88" width="26" height="26" rx="7" fill="#22d3ee" opacity="0.9" />
  <rect x="88" y="392" width="20" height="20" rx="6" fill="#f472b6" opacity="0.85" />
  <circle cx="432" cy="392" r="9" fill="#7c5cff" />
  <circle cx="80" cy="112" r="7" fill="#fbbf24" opacity="0.9" />
</svg>
